<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order received — The Cozy Loaf</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Itim&family=Figtree:ital,wght@0,300..900;1,400..600&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════
   THE COZY LOAF
   The Instagram is the brief: type and drawings on warm paper, with
   air around them. So there is one cream sheet from top to bottom and
   nothing sits in a box. Brown is ink — lines, letters, marks — never
   a filled panel. Edges are drawn rather than ruled: every border gets
   an irregular radius so no two corners match, the way a pen behaves.
   Photographs lie straight on the paper, slightly off-square, their
   black grounds reading as prints pasted into a notebook.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --cream:#FDF4E3;          /* the paper, sampled from the posts */
  --paper:#F8EBD4;          /* a half-tone, for the order slip */
  --ink:#924A23;            /* the brown of the posts' handwriting */
  --ink-soft:#8A5E35;       /* secondary notes */
  --rust:#A8503A;           /* prices, the one filled label */
  --blush:#F4D5CB;
  --sage:#D6DFC9;
  --sage-ink:#8C9B78;        /* a muted sage, for one hairline */
  --blush-wash:#FBEAE2;      /* the one blush field on the page */
  --night:#0C0D11;          /* the photographs bring their own dark */

  --hand:"Itim","Bradley Hand","Comic Sans MS",cursive;
  --ui:"Figtree","Helvetica Neue",Helvetica,Arial,sans-serif;

  --gut:clamp(1.15rem,5vw,3.5rem);
  --maxw:74rem;
  --pop:cubic-bezier(.22,1.2,.36,1);

  /* Corners a hand would make: four different radii, never a circle. */
  --r-a:18px 11px 20px 13px / 13px 19px 12px 18px;
  --r-b:12px 20px 10px 18px / 17px 11px 20px 12px;
  --r-pill:26px 20px 24px 22px / 22px 25px 20px 24px;
  /* a stamped tag: square enough to read as print, uneven enough to be drawn */
  --r-tag:7px 4px 8px 5px / 5px 8px 4px 7px;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--cream);color:var(--ink);
  font-family:var(--ui);font-size:1.0625rem;line-height:1.65;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gut)}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.skip{position:absolute;left:-9999px;padding:.85rem 1.1rem}
.skip:focus{left:1rem;top:1rem;z-index:200;background:var(--rust);color:var(--cream);padding:.85rem 1.1rem;border-radius:var(--r-pill);font-weight:700}

h1,h2,h3{font-family:var(--hand);font-weight:400;line-height:1.08;letter-spacing:0;margin:0;text-wrap:balance}
.ital{color:var(--rust)}

/* ── Marginalia ───────────────────────────────────────────────
   Small handwritten labels, drawn rules and arrows. These carry the
   structure the old design got from coloured bands and borders. */
.note{font-family:var(--hand);font-size:1.05rem;line-height:1.3;color:var(--ink-soft)}
.note--rust{color:var(--rust)}
.rule{display:block;width:100%;height:14px;overflow:visible}
.rule path{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;opacity:.5;vector-effect:non-scaling-stroke}
.doodle{display:block;overflow:visible}
.doodle{color:var(--ink)}

/* A line drawn under a word, the way you underline by hand. */
.swash{position:absolute;left:0;right:0;bottom:0;width:100%;height:.3em;overflow:visible}
.swash path{fill:none;stroke:var(--rust);stroke-width:3.2;stroke-linecap:round;vector-effect:non-scaling-stroke}
[data-draw] .swash path{stroke-dasharray:var(--len,300);stroke-dashoffset:var(--len,300)}
[data-draw="in"] .swash path{stroke-dashoffset:0;transition:stroke-dashoffset 1.1s var(--pop) .15s}

/* ── Labels (what used to be buttons) ─────────────────────────
   A printed tag: a near-rectangle with corners a stamp would make, and
   a hairline ruled inside the edge the way a bakery label is printed.
   Never under 48px, never under 17px — charm is not worth a missed tap. */
.lbl{
  position:relative;
  display:inline-flex;align-items:center;justify-content:center;gap:.55rem;
  font-family:var(--hand);font-size:1.15rem;line-height:1;
  min-height:48px;padding:.78rem 1.5rem;
  border:2.5px solid var(--ink);border-radius:var(--r-tag);
  background:transparent;color:var(--ink);text-decoration:none;cursor:pointer;
  transition:transform .18s var(--pop), background .18s, color .18s;
}
.lbl::after{content:"";position:absolute;inset:3px;border:1px solid currentColor;
  border-radius:calc(var(--r-tag) - 2px);opacity:.3;pointer-events:none}
.lbl:hover,.lbl:focus-visible{transform:translateY(-2px) rotate(-.5deg);background:var(--blush)}
.lbl:active{transform:translateY(1px)}
.lbl--ink{background:var(--rust);border-color:var(--rust);color:var(--cream)}
.lbl--ink::after{opacity:.45}
.lbl--ink:hover,.lbl--ink:focus-visible{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.lbl--sm{min-height:44px;padding:.58rem 1.05rem;font-size:1rem;border-width:2px}
.lbl--sm::after{inset:2px}
.lbl[disabled]{cursor:not-allowed;transform:none;background:transparent;
  border-color:rgba(146,74,35,.35);border-style:dashed;color:var(--ink-soft);opacity:.85}
.lbl .nib{width:1.15em;height:.75em;flex:none}
.lbl .nib path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.lbl:hover .nib{transform:translateX(3px)}
.lbl .nib{transition:transform .22s var(--pop)}

/* ── Header ───────────────────────────────────────────────────
   A name and two words. Everything else was navigation furniture. */
.head{position:sticky;top:0;z-index:100;background:var(--cream)}
.head__in{display:flex;align-items:center;gap:.75rem;min-height:3.9rem}
.mark{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--ink);margin-right:auto;
  min-height:44px;padding-block:.35rem}
.mark img{width:2.3rem;height:2.3rem;object-fit:contain}
.mark img[hidden]{display:none}
.mark b{font-family:var(--hand);font-weight:400;font-size:1.3rem;line-height:1;white-space:nowrap}
.head__links{display:flex;align-items:center;gap:.85rem}
.head__links a{font-family:var(--hand);font-size:1.08rem;color:var(--ink);text-decoration:none;position:relative;
  display:inline-flex;align-items:center;min-height:44px;padding:.5rem .2rem}
.head__links a::after{content:"";position:absolute;left:.15rem;right:100%;bottom:.55rem;height:2px;background:var(--rust);transition:right .25s var(--pop)}
.head__links a:hover::after,.head__links a:focus-visible::after{right:.1rem}
.head__links .lbl--sm{padding:.5rem 1rem}
.head__rule{display:block;width:100%;height:9px;overflow:visible}
.head__rule path{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;opacity:.42;vector-effect:non-scaling-stroke}

/* ── Hero ─────────────────────────────────────────────────────
   The name, then the bread, then one thing to press. The name stays
   large; what came out is everything that used to sit above it. */
.hero{position:relative;padding-block:clamp(.6rem,2.5vw,1.4rem) clamp(1.4rem,4vw,2.2rem)}
.hero__in{display:grid;grid-template-areas:"text" "shot" "do";gap:0}
.hero__text{grid-area:text}
.shot{grid-area:shot}
.hero__do{grid-area:do}
.wordmark{font-size:clamp(3rem,15.5vw,6.2rem);line-height:.94}
.wordmark .u{display:inline-block;position:relative;padding-bottom:.14em}
.shot{position:relative;margin-top:clamp(.85rem,3vw,1.3rem);max-width:30rem}
.shot__img{
  position:relative;overflow:hidden;background:var(--night);
  border:2.5px solid var(--ink);border-radius:var(--r-a);
  aspect-ratio:5/4;transform:rotate(-1.4deg);
}
.shot__img img{width:100%;height:100%;object-fit:cover;object-position:center 62%}
.shot__fb{position:absolute;inset:0;display:none;place-content:center;text-align:center;padding:1.4rem;
  background:var(--paper);color:var(--ink)}
.shot__fb p{font-family:var(--hand);font-size:1.3rem;margin:0}
[data-empty="true"] .shot__img img{display:none}
[data-empty="true"] .shot__fb{display:grid}
/* The price, written on the paper just under the photograph — never
   over it, which would patch a pale rectangle into the loaf. */
.pricetag{margin:.55rem 0 0 .35rem;transform:rotate(-1.4deg)}
.pricetag b{font-family:var(--hand);font-weight:400;font-size:1.4rem;line-height:1.05;color:var(--rust);
  white-space:nowrap}
.hero__do{display:flex;flex-wrap:wrap;gap:.65rem;margin-top:clamp(1.5rem,5vw,2rem)}

/* On a phone the photograph is capped against the screen itself, so the
   order button stays on the first screen even on an SE. Scoped to the
   phone layout: a short desktop window must never inherit this cap. */
@media (max-width:61.99rem){
  @supports (height:1svh){
    .shot__img{max-height:40svh}
  }
}
@media (max-width:48rem) and (max-height:680px){
  .wordmark{font-size:clamp(2.4rem,12vw,3.4rem)}
  .hero{padding-block:.7rem 1.1rem}
  .hero__do{margin-top:1.6rem}
}
/* An SE has about 553px to play with once Safari has taken its share. */
@media (max-width:48rem) and (max-height:600px){
  .wordmark{font-size:clamp(2.1rem,10.5vw,2.9rem)}
  .hero__do{margin-top:1.15rem}
  @supports (height:1svh){ .shot__img{max-height:31svh} }
}

/* ── Divider between chapters ─────────────────────────────── */
.chapter{display:flex;align-items:center;gap:.9rem;margin-block:clamp(2rem,7vw,3rem) clamp(1rem,3.5vw,1.4rem)}
.chapter h2{font-size:clamp(1.6rem,6vw,2.3rem);white-space:nowrap}
.chapter .rule{flex:1;min-width:2rem}

/* ── The loaves ───────────────────────────────────────────────
   Two entries in a notebook, not two cells in a grid. Each is laid
   out a little differently so the page never looks ruled. */
.entry{position:relative;margin-top:clamp(1rem,3.5vw,1.5rem)}
.entry + .entry{margin-top:clamp(2.6rem,9vw,3.6rem)}
.entry__shot{position:relative;max-width:30rem}
.entry:nth-of-type(odd) .entry__shot{margin-right:clamp(1.2rem,11vw,4rem)}
.entry:nth-of-type(even) .entry__shot{margin-left:clamp(1.2rem,11vw,4rem)}
.entry__shot .frame{
  position:relative;overflow:hidden;background:var(--night);
  border:2.5px solid var(--ink);border-radius:var(--r-a);aspect-ratio:4/5;
}
.entry__shot .frame img{width:100%;height:100%;object-fit:cover;object-position:center 58%}
.entry:nth-of-type(odd) .entry__shot .frame{transform:rotate(-1.5deg)}
.entry:nth-of-type(even) .entry__shot .frame{transform:rotate(1.5deg)}
.entry__fb{position:absolute;inset:0;display:none;place-content:center;text-align:center;padding:1.5rem;background:var(--paper)}
.entry__fb p{font-family:var(--hand);font-size:1.35rem;margin:0}
.frame[data-empty="true"] > img{display:none}
.frame[data-empty="true"] .entry__fb{display:grid}
.entry__body{margin-top:clamp(1.1rem,4vw,1.5rem)}
.entry__name{font-size:clamp(2.1rem,9vw,3rem)}
/* A price is written, not boxed. Exactly one on the page is ringed —
   the entry with no description, which needs the extra weight. */
.price{display:flex;align-items:baseline;gap:.45rem;margin-top:.6rem}
.price b{font-family:var(--hand);font-weight:400;font-size:1.5rem;color:var(--rust)}
.price small{font-family:var(--ui);font-size:.82rem;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft)}
.price--ringed{position:relative;display:inline-flex;padding:.32rem 1rem .36rem;margin-left:.3rem}
.price--ringed .doodle{position:absolute;inset:-8% -2%;width:104%;height:116%;color:var(--rust);opacity:.75}
.price--ringed b,.price--ringed small{position:relative;z-index:1}
.entry__desc{font-size:1.08rem;line-height:1.65;max-width:34ch;margin:.85rem 0 0;color:var(--ink-soft)}
.entry__buy{margin-top:1.2rem}
/* The drawn loaf appears beside its own entry. */
/* The drawn loaf from the posts sits over the corner of the photograph of
   the same loaf. The lame sits beside the one it scores. Each appears once. */
.entry__sketch{position:absolute;right:-.7rem;bottom:-1.9rem;width:clamp(5.8rem,24vw,8rem);
  pointer-events:none;z-index:2;transform:rotate(-6deg)}
.entry__sketch img{width:100%}
.entry__tool{position:absolute;right:-.6rem;bottom:-2.4rem;width:clamp(3.2rem,11vw,4.4rem);height:auto;
  pointer-events:none;z-index:2;color:var(--ink);transform:rotate(-9deg)}
.entry__sketch img[hidden]{display:none}

/* ── The order slip ───────────────────────────────────────────
   One sheet, the way a bakery writes an order down: rows, a ruled
   line, a total under it. Not a dashboard. */
.slip{
  position:relative;margin-top:clamp(1rem,3.5vw,1.5rem);
  background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--r-a);
  padding:clamp(1.15rem,4.5vw,2rem);
}
.slip__head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  padding-bottom:.7rem;border-bottom:2px dashed rgba(146,74,35,.4)}
.slip__head h3{font-size:1.5rem}
.slip__head span{font-family:var(--hand);font-size:.98rem;color:var(--ink-soft)}
.slip__notes{display:grid;gap:.45rem;margin:.85rem 0 1.1rem;padding:0;list-style:none}
.slip__notes li{display:flex;gap:.55rem;align-items:flex-start;font-size:.97rem;line-height:1.5;color:var(--ink-soft)}
.slip__notes .doodle{width:.5rem;height:.5rem;flex:none;margin-top:.52rem;color:var(--sage-ink)}

.row{display:flex;align-items:center;gap:.85rem;padding-block:.95rem;border-bottom:2px dotted rgba(146,74,35,.3)}
.row:first-of-type{border-top:0}
.row__name{flex:1;min-width:0}
.row__name h4{font-family:var(--hand);font-weight:400;font-size:1.3rem;line-height:1.1;margin:0}
.row__name p{font-family:var(--ui);font-size:.9rem;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);margin:.15rem 0 0}
/* Quantity: two drawn circles and a written number. */
.step{display:flex;align-items:center;gap:.15rem;flex:none}
.step button{
  width:46px;height:46px;flex:none;border:2.5px solid var(--ink);border-radius:50%;
  background:transparent;color:var(--ink);font-family:var(--hand);font-size:1.5rem;line-height:1;
  cursor:pointer;display:grid;place-content:center;transition:background .18s,transform .18s var(--pop);
}
.step button:hover:not([disabled]){background:var(--blush);transform:rotate(-5deg)}
.step button[disabled]{opacity:.3;cursor:not-allowed}
.step output{min-width:2.5rem;text-align:center;font-family:var(--hand);font-size:1.5rem;color:var(--ink)}

.tally{margin:1.3rem 0 0;padding:0}
.tally__lines{display:grid;gap:.45rem;min-height:1.6rem;margin-bottom:.9rem}
.basket__line{display:flex;justify-content:space-between;gap:1rem;font-size:.98rem;font-weight:600}
.basket__line span:last-child,.sums dd{white-space:nowrap}
.basket__empty{font-family:var(--hand);font-size:1.15rem;color:var(--ink-soft);margin:0}
.sums{display:grid;gap:.5rem;margin:0;padding-top:.9rem;border-top:2.5px solid var(--ink)}
.sums div{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;font-size:.97rem;font-weight:600}
.sums dt,.sums dd{margin:0}
.sums .big dt,.sums .big dd{font-family:var(--hand);font-weight:400;font-size:1.45rem}
.sums .muted{color:var(--ink-soft);font-weight:600}
.slip__go{margin-top:1.3rem}
.slip__go .lbl{width:100%}
.slip__fine{margin:.8rem 0 0;font-size:.88rem;text-align:center;color:var(--ink-soft);line-height:1.5}

/* ── Delivery details ─────────────────────────────────────────
   Ruled lines to write on, not moulded input boxes. */
.checkout{margin-top:clamp(1.3rem,4vw,1.7rem);padding-top:clamp(1.3rem,4vw,1.7rem);
  border-top:2px dashed rgba(146,74,35,.4);display:none}
.checkout[data-open="true"]{display:block;animation:lift .4s var(--pop) both}
@keyframes lift{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.checkout h3{font-size:1.65rem}
.checkout__promise{margin:.35rem 0 0;font-size:.97rem;color:var(--ink-soft)}
.fields{display:grid;gap:.95rem;margin-top:1.2rem}
.field{display:flex;flex-direction:column;gap:.15rem}
.field label{font-family:var(--ui);font-weight:800;font-size:.82rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:.1rem}
.field label .opt{font-weight:600;letter-spacing:0;text-transform:none}
.field input,.field select,.field textarea{
  font-family:var(--ui);font-size:1.0625rem;color:var(--ink);
  background:transparent;
  border:0;border-bottom:2px solid rgba(146,74,35,.5);border-radius:0;
  padding:.62rem .1rem .28rem;width:100%;min-height:44px;transition:border-color .18s;
}
.field textarea{resize:vertical;min-height:3.3rem;padding-top:.4rem;line-height:1.55}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;
  border-bottom-color:var(--rust);border-bottom-width:2.5px;box-shadow:0 1px 0 var(--rust)}
.field select{appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 10px) calc(50% + 1px),calc(100% - 4px) calc(50% + 1px);
  background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:1.6rem}
.field select optgroup{font-family:var(--ui);font-weight:800;color:var(--rust)}
.field select option{font-weight:400;color:var(--ink)}
.field input::placeholder,.field textarea::placeholder{color:rgba(138,94,53,.6)}
.field small{font-size:.88rem;color:var(--ink-soft);line-height:1.45}
.field .err{font-family:var(--ui);font-size:.88rem;font-weight:700;color:var(--rust);min-height:0;margin:0}
.field--bad .err{min-height:1.1rem;margin-top:.15rem}
.field--bad input,.field--bad select,.field--bad textarea{border-bottom-color:var(--rust)}
.checkout__foot{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;margin-top:1.6rem}
.checkout__foot .lbl--ink{flex:1 1 14rem}
.formnote{margin:0;font-family:var(--ui);font-weight:700;font-size:.92rem;color:var(--rust)}

/* ── The end of the note ──────────────────────────────────────
   A label off the back of a bag, stuck on slightly crooked: set left
   like a printed label rather than centred like a web card, aligned to
   the same gutter as every heading above it, and sitting a degree off
   square. One border, not a frame inside a frame. The heart sits with
   the handle the way it does under the posts. The logo slot waits at
   the top, empty and reserved, until the real crest lands. */
.signoff{padding-block:clamp(2.4rem,8vw,3.6rem) clamp(2.4rem,8vw,3.8rem)}
.stamp{
  position:relative;max-width:23rem;text-align:left;
  background:var(--blush-wash);border:2.5px solid var(--ink);border-radius:var(--r-tag);
  padding:clamp(1.3rem,5vw,1.7rem) clamp(1.2rem,4.5vw,1.6rem) clamp(1.1rem,4vw,1.4rem);
  transform:rotate(-1.1deg);
}
.stamp__logo{width:4.2rem;margin:0 0 .8rem}
.stamp__logo[hidden]{display:none}
.stamp h2{font-size:clamp(1.4rem,5.2vw,1.75rem)}
.stamp__rule{display:block;width:4.2rem;height:8px;margin:.75rem 0 .85rem;overflow:visible}
.stamp__rule path{fill:none;stroke:var(--sage-ink);stroke-width:2;stroke-linecap:round;vector-effect:non-scaling-stroke}
.stamp__sign{display:flex;align-items:center;gap:.5rem;margin:0}
.stamp__sign .doodle{width:1.15rem;height:1rem;flex:none;color:var(--ink)}
.stamp .handle{font-family:var(--hand);font-size:1.22rem;color:var(--ink);
  text-decoration:none;padding:.35rem .1rem;transition:color .2s}
.stamp .handle:hover{color:var(--rust)}
.stamp p.fine{margin:.2rem 0 0;font-size:.95rem;color:var(--ink-soft)}

/* ── Desktop ──────────────────────────────────────────────────
   The phone layout opens out; it is not replaced. Two columns only
   where a column genuinely helps, and the tilts stay. */
@media (min-width:62rem){
  /* The hero is one composition held in the middle of the screen: the
     photograph takes the larger share, the name and the button sit
     against it, and the price is written into the gap between them.
     No row is left over to go empty. */
  .hero{padding-block:clamp(1.6rem,3vw,2.6rem) clamp(1.8rem,3.5vw,2.6rem)}
  .hero__in{grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);
    grid-template-areas:"text shot" "do shot";
    grid-template-rows:auto auto;
    column-gap:clamp(2rem,4.5vw,3.5rem);
    align-items:start;row-gap:clamp(1.2rem,2vw,1.7rem)}
  .hero__text{align-self:end}
  .shot{margin-top:0;align-self:center;grid-row:1/span 2;max-width:26rem;margin-left:auto}
  /* The name commands its column instead of sitting in the middle of it. */
  .wordmark{font-size:clamp(3.4rem,8.6vw,8.2rem)}
  .shot__img{aspect-ratio:1/1;transform:rotate(-1.1deg)}
  .hero__do{align-self:start}
  .pricetag{margin:.7rem 0 0 .5rem}
  .pricetag b{font-size:1.5rem}

  /* Product entries interlock: the photograph is the larger column and
     the writing hangs back into its gutter instead of floating away. */
  .entry{display:grid;grid-template-columns:minmax(0,.88fr) minmax(0,1.12fr);
    column-gap:clamp(2rem,4vw,3.4rem);align-items:center}
  .entry:nth-of-type(even){grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr)}
  .entry:nth-of-type(even) .entry__shot{order:2}
  .entry__shot{max-width:26rem}
  .entry:nth-of-type(odd) .entry__shot{margin-right:0}
  .entry:nth-of-type(even) .entry__shot{margin-left:auto;margin-right:0}
  .entry__body{margin-top:0}
  .entry__shot .frame{aspect-ratio:1/1}
  .entry__shot .frame img{object-position:center 68%}
  .entry__name{font-size:clamp(2.1rem,3.4vw,3rem)}

  .slip{padding:clamp(1.8rem,2.6vw,2.3rem)}
  .slip__body{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(18rem,.85fr);
    column-gap:clamp(1.8rem,3.5vw,2.6rem);align-items:start}
  .tally{margin-top:0;padding-left:clamp(1.4rem,2.5vw,2rem);border-left:2px dashed rgba(146,74,35,.4)}
  .fields--2{grid-template-columns:1fr 1fr}
  .checkout__foot .lbl--ink{flex:0 0 auto}
}

/* ── Reveal ───────────────────────────────────────────────────
   The page renders at rest; JS opts elements in, and only ever moves
   them a little. Nothing waits on an animation to become usable. */
[data-reveal="pending"]{opacity:0;transform:translateY(22px)}
[data-reveal="pending"][data-from="left"],
[data-reveal="pending"][data-from="right"]{transform:translateY(22px)}
[data-reveal="pending"][data-from="pop"]{transform:scale(.96)}
[data-reveal="in"]{opacity:1;transform:none;transition:opacity .7s var(--pop),transform .8s var(--pop)}
@media (min-width:62rem){
  [data-reveal="pending"][data-from="left"]{transform:translate(-26px,14px) rotate(-1.2deg)}
  [data-reveal="pending"][data-from="right"]{transform:translate(26px,14px) rotate(1.2deg)}
}

section[id],#checkout{scroll-margin-top:5.6rem}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  [data-reveal]{opacity:1 !important;transform:none !important}
  [data-draw] .swash path{stroke-dashoffset:0 !important}
}
/* ── Confirmation ─────────────────────────────────────────────
   The same sheet of paper, with the order written onto it. */
.conf{padding-block:clamp(1.8rem,7vw,3.5rem) clamp(2rem,7vw,3.5rem)}
.conf__head{text-align:center;margin-bottom:clamp(1.6rem,6vw,2.4rem)}
.conf__head h1{font-size:clamp(2.2rem,9vw,3.2rem)}
.conf__ref{display:inline-block;margin-top:.9rem;font-family:var(--hand);font-size:1.3rem;color:var(--rust);
  border:2.5px solid var(--rust);border-radius:var(--r-b);padding:.3rem 1rem;transform:rotate(-1.4deg)}
.conf__promise{display:block;margin-top:.9rem;font-size:.98rem;color:var(--ink-soft)}
.conf__sheet{background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--r-a);
  padding:clamp(1.15rem,4.5vw,2rem)}
.conf__sec + .conf__sec{margin-top:1.4rem;padding-top:1.3rem;border-top:2px dashed rgba(146,74,35,.4)}
.conf__sec h2{font-family:var(--ui);font-weight:800;font-size:.82rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-soft);margin:0 0 .8rem}
.rows{display:grid;gap:.6rem;margin:0}
.rows div{display:flex;justify-content:space-between;gap:1.2rem;align-items:baseline}
.rows dt{margin:0;font-weight:600;color:var(--ink-soft)}
.rows dd{margin:0;font-weight:700;text-align:right;white-space:nowrap;color:var(--ink)}
.rows dd.wrap-any{white-space:normal;overflow-wrap:anywhere}
.rows .muted dd{font-weight:600;color:var(--ink-soft)}
.rows .item dt{font-weight:700;color:var(--ink)}
.rows .tot{border-top:2.5px solid var(--ink);padding-top:.7rem;margin-top:.3rem}
.rows .tot dt,.rows .tot dd{font-family:var(--hand);font-weight:400;font-size:1.35rem;color:var(--ink)}
.conf__cta{margin-top:clamp(1.6rem,6vw,2.2rem);text-align:center}
.empty{text-align:center;padding-block:2rem}
.empty h1{font-size:clamp(1.9rem,7vw,2.6rem)}
.empty p{max-width:34ch;margin:1rem auto 0;color:var(--ink-soft)}
</style>
</head>
<body>

<svg class="defs" aria-hidden="true" focusable="false">
  <symbol id="d-arrow" viewBox="0 0 60 40" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 8 C19 5 36 11 47 26"/><path d="M36 24 L49 28 L44 15"/>
  </symbol>
  <symbol id="d-arrow-r" viewBox="0 0 26 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 8 L22 8"/><path d="M16 3 L23 8 L16 13"/>
  </symbol>
  <symbol id="d-heart" viewBox="0 0 32 28">
    <path fill="currentColor" d="M16 26.5 C5.6 18 1.5 12.2 1.5 7.9 C1.5 4 4.4 1 8.3 1 C11.4 1 14.2 3 16 6.1 C17.8 3 20.6 1 23.7 1 C27.6 1 30.5 4 30.5 7.9 C30.5 12.2 26.4 18 16 26.5Z"/>
  </symbol>
  <symbol id="d-dot" viewBox="0 0 16 16">
    <path fill="currentColor" d="M8 1 C11.9 1.4 15 4.3 15 8.2 C15 12 11.6 15 7.8 15 C4 15 1 11.8 1 8 C1 4.2 4.1 1.3 8 1Z"/>
  </symbol>
  <symbol id="d-ring" viewBox="0 0 120 50" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <path d="M60 2.5 C92 2 117 7.5 117.5 23 C118 39 90 47.5 59 47.5 C27 47.5 2 40 2.5 24 C3 9 25 3.5 54 2.6"/>
  </symbol>
  <!-- A lame, the curved blade a loaf is scored with, and the slashes it
       leaves. Built from filled shapes so it survives any inherited stroke. -->
  <symbol id="d-lame" viewBox="0 0 100 140">
    <g fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" opacity=".5">
      <path d="M13 112 C22 99 31 90 42 84"/><path d="M9 94 C18 81 27 72 38 66"/>
    </g>
    <g transform="rotate(-17 54 76)" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round">
      <path fill="currentColor" d="M47 70 L61 70 L61 132 C61 136 58 138 54 138 C50 138 47 136 47 132 Z"/>
      <path fill="#F4D5CB" d="M57 74 C41 55 40 28 61 7 C62 32 62 54 65 75 Z"/>
      <path fill="none" stroke-width="2.2" opacity=".5" d="M61 15 C60 34 61 54 63 72"/>
    </g>
  </symbol>
</svg>

<header class="head">
  <div class="wrap head__in">
    <a class="mark" href="index.html">
      <img alt="" data-logo>
      <b>The Cozy Loaf</b>
    </a>
    <nav class="head__links" aria-label="Main">
      <a href="https://instagram.com/thecozyloaf_eg" target="_blank" rel="noopener">Instagram</a>
    </nav>
  </div>
  <svg class="head__rule" viewBox="0 0 1200 9" preserveAspectRatio="none" aria-hidden="true">
    <path d="M2 5 C140 2 260 7 420 4 C580 1.5 700 7.5 860 4.5 C980 2.5 1100 6.5 1198 4"/>
  </svg>
</header>

<main class="conf">
  <div class="wrap">

    <div id="found" hidden>
      <div class="conf__head">
        <img class="logo" alt="" data-logo hidden>
        <h1>Order <span class="ital">received</span></h1>
        <p><span class="conf__ref" id="ref"></span></p>
        <p><span class="conf__promise" id="promise"></span></p>
      </div>

      <div class="conf__sheet">
        <div class="conf__sec">
          <h2>Your loaves</h2>
          <dl class="rows" id="items"></dl>
        </div>
        <div class="conf__sec">
          <h2>Totals</h2>
          <dl class="rows" id="totals"></dl>
        </div>
        <div class="conf__sec">
          <h2>Delivery</h2>
          <dl class="rows" id="delivery"></dl>
        </div>
      </div>

      <div class="conf__cta">
        <a class="lbl lbl--ink" href="index.html" id="again">Back to home <svg class="nib" viewBox="0 0 26 16" aria-hidden="true"><use href="#d-arrow-r"/></svg></a>
      </div>
    </div>

    <div id="missing" class="empty" hidden>
      <h1>We could not find that order</h1>
      <p>The confirmation for an order is only shown once, right after it is placed.</p>
      <div class="conf__cta"><a class="lbl" href="index.html">Back to home</a></div>
    </div>

  </div>
</main>

<footer class="signoff">
  <div class="wrap">
    <div class="stamp">
      <img class="stamp__logo" alt="" data-logo>
      <h2>Slow rise, <span class="ital">warm heart.</span></h2>
      <svg class="stamp__rule" viewBox="0 0 88 8" preserveAspectRatio="none" aria-hidden="true">
        <path d="M2 4.5 C20 2 38 6.5 56 3.5 C68 1.8 80 5.5 86 4"/>
      </svg>
      <p class="stamp__sign">
        <svg class="doodle" viewBox="0 0 32 28" aria-hidden="true"><use href="#d-heart"/></svg>
        <a class="handle" href="https://instagram.com/thecozyloaf_eg" target="_blank" rel="noopener">@thecozyloaf_eg</a>
      </p>
      <p class="fine">Delivery across the areas listed at checkout</p>
    </div>
  </div>
</footer>

<script src="config.js"></script>
<script>
window.renderConfirmation = function () {
  "use strict";
  const $ = s => document.querySelector(s);
  const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const egp = n => "EGP " + Number(n).toLocaleString("en-US");

  $$("[data-logo]").forEach(img => window.cozyImage(img, (window.COZY_CONFIG.images || {}).logo, () => { img.hidden = true; }));


  /* The order was handed over in sessionStorage; the URL names it. */
  let order = null;
  try { order = JSON.parse(sessionStorage.getItem("cozyloaf.lastOrder") || "null"); } catch (e) {}
  const want = new URLSearchParams(location.search).get("ref");
  if (order && want && order.reference !== want) order = null;

  if (!order) { $("#missing").hidden = false; return; }

  $("#found").hidden = false;
  document.title = "Order " + order.reference + " — The Cozy Loaf";
  $("#ref").textContent = order.reference;

  $("#items").innerHTML = order.items.map(i =>
    '<div class="item"><dt>' + i.quantity + " \u00d7 " + esc(i.name) + "</dt><dd>" + egp(i.lineTotal) + "</dd></div>").join("");

  $("#totals").innerHTML =
    "<div><dt>Subtotal</dt><dd>" + egp(order.subtotal) + "</dd></div>" +
    '<div class="muted"><dt>Delivery fee</dt><dd>To be confirmed</dd></div>' +
    '<div class="tot"><dt>Total before delivery</dt><dd>' + egp(order.totalBeforeDelivery) + "</dd></div>";

  /* The delivery date leads, because it is the one thing the customer
     will come back to this page to check. Rows with nothing in them
     are dropped rather than printed empty, so an order placed before
     the date picker existed still reads correctly. */
  $("#delivery").innerHTML = [
    ["Delivery date", order.deliveryDateLabel || order.deliveryDate],
    ["Name", order.customer.fullName],
    ["Address", order.customer.address],
    ["Area", order.customer.area]
  ].filter(r => r[1]).map(r =>
    '<div><dt>' + esc(r[0]) + '</dt><dd class="wrap-any">' + esc(r[1]) + "</dd></div>").join("");

  $("#promise").textContent = (window.COZY_CONFIG || {}).deliveryPromise || "";

  /* Leaving this page must not leave a stale order behind. */
  $("#again").addEventListener("click", () => {
    try { sessionStorage.removeItem("cozyloaf.lastOrder"); } catch (e) {}
  });
};

/* Standalone page runs itself. When this markup is inlined into the shop page
   for a single-file preview, the shop calls it instead. */
if (!document.getElementById("confirm-screen")) window.renderConfirmation();
</script>
</body>
